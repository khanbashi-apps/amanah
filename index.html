<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أمانة</title>
<meta name="description" content="أمانة — ديونك وحقوقك بوضوح">
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمانة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
@font-face{font-family:"Almarai";font-weight:400;font-display:swap;src:url("fonts/almarai-arabic-400-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Almarai";font-weight:700;font-display:swap;src:url("fonts/almarai-arabic-700-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Almarai";font-weight:800;font-display:swap;src:url("fonts/almarai-arabic-800-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Almarai";font-weight:400;font-display:swap;src:url("fonts/almarai-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Almarai";font-weight:700;font-display:swap;src:url("fonts/almarai-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Almarai";font-weight:800;font-display:swap;src:url("fonts/almarai-latin-800-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}

/* أمانة v1.1 — نموذج D: بطاقات مربعة مكدّسة كالمحفظة. التخطيط: عمود هاتف واحد، الملخص ثم التنبيهات ثم البطاقات */
:root{
  --bg:#F1F2F4; --surf:#FFFFFF; --surf2:#E7E9ED; --ink:#16181D; --muted:#5D6470; --line:#E3E5E9;
  --plus:#17694A; --minus:#A63D33; --warn-bg:#FFF4E0; --warn:#9A5208; --ok-bg:#E3F3EA; --ok:#17694A;
  --inv:#16181D; --inv-ink:#FFFFFF; --accent:#1F6F78; --scrim:rgba(15,17,20,.45);
  --font:"Almarai", -apple-system, "SF Arabic", Tahoma, sans-serif;
  --cw:min(calc(100vw - 32px), 448px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root[data-mode="auto"]{
    --bg:#0F1114; --surf:#1A1D22; --surf2:#262A31; --ink:#EEF0F3; --muted:#9AA1AC; --line:#2A2F37;
    --plus:#6FCF9B; --minus:#F0907F; --warn-bg:#2B2416; --warn:#E7B865; --ok-bg:#16291F; --ok:#6FCF9B;
    --inv:#EEF0F3; --inv-ink:#0F1114; --accent:#5FB7C0; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-mode="dark"]{
  --bg:#0F1114; --surf:#1A1D22; --surf2:#262A31; --ink:#EEF0F3; --muted:#9AA1AC; --line:#2A2F37;
  --plus:#6FCF9B; --minus:#F0907F; --warn-bg:#2B2416; --warn:#E7B865; --ok-bg:#16291F; --ok:#6FCF9B;
  --inv:#EEF0F3; --inv-ink:#0F1114; --accent:#5FB7C0; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

.app{max-width:480px;margin:0 auto;min-height:100%;padding:max(14px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand b{font-weight:800;font-size:25px;letter-spacing:0}
.top-actions{display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--surf);display:grid;place-items:center;flex:none}
.ibtn.inv{background:var(--inv)}
.ibtn svg{width:20px;height:20px}
.back{height:44px;display:flex;align-items:center;gap:2px;font-weight:700;color:var(--accent);font-size:15px;padding-inline-end:8px}
.back svg{width:20px;height:20px}
.title{font-weight:800;font-size:17px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surf);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.tile small{font-size:12px;color:var(--muted)}
.tile b{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.inv{background:var(--inv);color:var(--inv-ink)}
.tile.inv small{color:inherit;opacity:.75}

/* banners */
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);border-radius:16px;padding:8px 10px 8px 12px}
.banner .dot{width:10px;height:10px;border-radius:50%;background:#D9822B;flex:none}
.banner.soon .dot{background:var(--accent)}
.banner .txt{flex:1;min-width:0;font-size:13px;line-height:1.4}
.banner .txt b{display:block;font-size:14px}
.banner .txt span{color:var(--muted)}
.banner .act{height:40px;padding:0 12px;border-radius:12px;background:var(--inv);color:var(--inv-ink);font-size:13px;font-weight:700;flex:none}
.note-bar{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:16px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note-bar button{color:var(--accent);font-weight:700;padding:6px 0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.fchip{height:36px;padding:0 14px;border-radius:999px;background:var(--surf);font-size:13px;font-weight:700;white-space:nowrap;flex:none;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--inv);color:var(--inv-ink)}

/* stack of square passes */
.stack{position:relative}
.pass{position:absolute;inset-inline:0;height:var(--cw);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:right;width:100%;transition:top .35s cubic-bezier(.2,.8,.2,1),transform .2s;box-shadow:0 -6px 18px rgba(0,0,0,.14)}
.pass.white{box-shadow:0 -4px 14px rgba(0,0,0,.08);outline:1px solid #DADDE2;outline-offset:-1px}
.pass:active{transform:scale(.99)}
.pass.static{position:relative;inset:auto;box-shadow:none}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.p-name{display:flex;flex-direction:column;min-width:0}
.p-name b{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-name span{font-size:12px;opacity:.85}
.p-right{display:flex;align-items:center;gap:8px;flex:none}
.p-mini{font-weight:800;font-size:17px}
.pchip{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.pchip.due{background:#FFD9A8;color:#5A3405}
.pchip.soon{background:rgba(255,255,255,.22)}
.pchip.paid{background:rgba(255,255,255,.22)}
.pchip.done{background:rgba(255,255,255,.22)}
.pass.white .pchip.soon,.pass.white .pchip.paid,.pass.white .pchip.done{background:#EEF0F3}
.p-amt{display:flex;flex-direction:column;margin-top:4px}
.p-amt small{font-size:12px;opacity:.85}
.p-amt b{font-weight:800;font-size:clamp(38px,13vw,54px);line-height:1.05}
.p-amt b i{font-style:normal;font-size:16px;font-weight:400}
.segs{display:grid;gap:3px}
.segs span{height:7px;border-radius:3px}
.bar{height:7px;border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px}
.p-prog{font-size:12px;opacity:.85}
.p-info{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:auto}
.p-info span{opacity:.92}
.p-info b{font-weight:800}
.p-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed currentColor;padding-top:12px;font-size:11px}
.p-foot span{display:flex;flex-direction:column;opacity:.85;min-width:0}
.p-foot b{font-size:15px;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-foot{border-top-color:rgba(255,255,255,.35)}
.pass.white .p-foot{border-top-color:#D5D9DF}
.hint{font-size:12px;color:var(--muted);text-align:center}

/* empty */
.empty{border:2px dashed var(--line);border-radius:26px;height:var(--cw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.empty img{width:72px;height:72px;border-radius:18px}
.empty b{font-size:18px}
.empty p{color:var(--muted);font-size:14px;max-width:28ch}

/* buttons */
.btn{height:54px;border-radius:18px;background:var(--inv);color:var(--inv-ink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px}
.btn.wa{background:#1FA855;color:#fff}
.btn.ghost{background:var(--surf);color:var(--ink)}
.btn.danger{background:transparent;color:var(--minus);height:48px}
.btn:disabled{opacity:.5}
.btn svg{width:20px;height:20px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{height:62px;border-radius:16px;background:var(--surf);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act svg{width:20px;height:20px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* panels */
.panel{background:var(--surf);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column}
.panel h3{font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;padding-bottom:6px}
.panel h3 small{font-size:12px;color:var(--muted);font-weight:400}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li .l{display:flex;flex-direction:column;min-width:0}
.li .l small{font-size:12px;color:var(--muted)}
.li .r{display:flex;align-items:center;gap:6px;font-weight:700;flex:none}
.li .x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.li .x svg{width:16px;height:16px}
.muted{color:var(--muted)}
.plus{color:var(--plus)}.minus{color:var(--minus)}
.atts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.att{height:84px;border-radius:14px;background:var(--surf2);overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att span.lbl{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;padding:12px 6px 4px;font-size:10px;text-align:center}
.att.add{background:transparent;border:1.5px dashed var(--line)}
.att svg{width:20px;height:20px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:transparent;transition:background .25s}
.sheet-wrap.on{background:var(--scrim)}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:480px;width:100%;margin:0 auto}
.sheet-wrap.on .sheet{transform:none}
.grab{align-self:center;width:44px;height:5px;border-radius:5px;background:var(--line);flex:none}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-top b{font-weight:800;font-size:18px}
.sh-top button{color:var(--muted);padding:10px 4px;font-size:15px}
.sh-top button.save{color:var(--accent);font-weight:800}
.form{background:var(--surf);border-radius:20px;display:flex;flex-direction:column}
.fld{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px;min-height:52px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.fld:first-child{border-top:0}
.fld input,.fld select{border:0;background:transparent;text-align:left;font-size:16px;color:var(--ink);min-width:0;flex:1;height:50px;outline:none}
.fld input[type="date"]{direction:ltr;text-align:left}
.fld .unit{color:var(--muted);font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surf2);border-radius:14px}
.seg button{height:42px;border-radius:11px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
.sw.white{border-color:#DADDE2}
.calc{background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700}
.calc small{display:block;font-weight:400;font-size:12px}
.err{color:var(--minus);font-size:13px;min-height:1em}
textarea{width:100%;border:0;background:var(--surf);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7;resize:none;min-height:200px;overflow:hidden;color:var(--ink);outline:none}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchip{height:36px;padding:0 12px;border-radius:999px;background:var(--surf);font-size:13px;font-weight:700}
.big-input{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:8px 0}
.big-input input{width:60%;text-align:center;border:0;background:transparent;font-size:48px;font-weight:800;outline:none;color:var(--ink)}

/* share */
.preview{width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--surf2)}
.preview img{width:100%;height:100%;display:block}
.trow{display:flex;align-items:center;gap:10px;padding:6px 14px;min-height:52px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tl{width:92px;flex:none;font-size:13px;color:var(--muted)}
.trow input[type="text"]{flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none;color:var(--ink);height:40px}
.trow input[type="text"]:disabled{opacity:.4}
.switch{position:relative;width:48px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--surf2);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(-18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.sec-t{font-size:13px;color:var(--muted);padding:4px 4px 0}

/* lock */
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.lock img{width:72px;height:72px;border-radius:18px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--surf);font-size:26px;font-weight:700;display:grid;place-items:center}
.pad button svg{width:26px;height:26px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--inv);color:var(--inv-ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ver{font-size:12px;color:var(--muted);text-align:center}
.viewer img{width:100%;border-radius:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filepick" class="hide" accept="image/*,application/pdf">
<input type="file" id="backuppick" class="hide" accept="application/json,.json">
<script src="lib/jspdf.umd.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
